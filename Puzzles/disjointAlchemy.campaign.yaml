  - ID: "Disjoint_0_1" # THIS IS IMPORTANT!
    Title: "Lesson: Disjoint Molecules"
    Puzzle: "ch0/puzzle1" # this needs to point to a .puzzle or a .puzzle.yaml in the "Puzzles" folder of this mod
    NoStoryPanel: false # not actually needed, since false is the default. this says "yes, there is a story panel"
    Icon: "textures/puzzle_select/icon_tutorial"
    IconSmall: "textures/puzzle_select/icon_tutorial_small"

  - ID: "Disjoint_0_2"
