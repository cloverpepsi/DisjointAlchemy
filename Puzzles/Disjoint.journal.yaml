Title: "The Journal of Disjoint Alchemy"
Chapters:
- Title: "Volume XVII, Issue I: Magnetism in Animismus"
  Description: "The atoms of vitae and mors, while most often used in the context of the forces of life and death, have an equally important property of mutual magnetism: the opposite animus charges exert an attractive force on one another. This property in disjoint compounds seems to be heightened, and this issue is dedicated to landmark experiments that helped to demonstrate this concept."  
